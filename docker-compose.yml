version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: promptler-postgres
    environment:
      POSTGRES_USER: promptler
      POSTGRES_PASSWORD: promptler
      POSTGRES_DB: promptler_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptler"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
